version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - SECRET_KEY=kunci_rahasia_untuk_local
      # KONEKSI DATABASE
      - DB_HOST=db
      - DB_PORT=3306        # <--- WAJIB 3306 (Internal Port), JANGAN 3307
      - DB_DATABASE=spk_db
      - DB_USERNAME=user
      - DB_PASSWORD=password
    depends_on:
      - db
    deploy:
      restart_policy:
        condition: on-failure

  db:
    image: mariadb:10.6
    environment:
      MYSQL_DATABASE: spk_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - spk_db_data_v3:/var/lib/mysql
    networks:      # <--- Tambahkan ini
      - spk_network

volumes:
  spk_db_data_v3:

networks:          # <--- Definisikan network di sini
  spk_network:
    driver: bridge